name: Deploy to k3s

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hyunwoo1229/pixo-backend
  K8S_NAMESPACE: pixo
  K8S_DEPLOYMENT: pixo-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Generate Dockerfile
        run: |
          cat > Dockerfile <<'EOF'
          FROM eclipse-temurin:21-jre-jammy
          WORKDIR /app
          COPY build/libs/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "/app/app.jar"]
          EOF
          rm -f build/libs/*-plain.jar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Sync secrets to k3s
        run: |
          kubectl create secret generic pixo-env -n ${{ env.K8S_NAMESPACE }} \
            --from-literal=SPRING_DATASOURCE_URL='${{ secrets.SPRING_DATASOURCE_URL }}' \
            --from-literal=SPRING_DATASOURCE_USERNAME='${{ secrets.SPRING_DATASOURCE_USERNAME }}' \
            --from-literal=SPRING_DATASOURCE_PASSWORD='${{ secrets.SPRING_DATASOURCE_PASSWORD }}' \
            --from-literal=SPRING_JPA_HIBERNATE_DIALECT='${{ secrets.SPRING_JPA_HIBERNATE_DIALECT }}' \
            --from-literal=SPRING_DATA_REDIS_HOST='pixo-redis' \
            --from-literal=SPRING_DATA_REDIS_PORT='6379' \
            --from-literal=SPRING_MAIL_HOST='${{ secrets.SPRING_MAIL_HOST }}' \
            --from-literal=SPRING_MAIL_PORT='${{ secrets.SPRING_MAIL_PORT }}' \
            --from-literal=SPRING_MAIL_USERNAME='${{ secrets.SPRING_MAIL_USERNAME }}' \
            --from-literal=SPRING_MAIL_PASSWORD='${{ secrets.SPRING_MAIL_PASSWORD }}' \
            --from-literal=SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH='${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}' \
            --from-literal=SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE='${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}' \
            --from-literal=SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM='${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM }}' \
            --from-literal=SPRING_CLOUD_AWS_REGION_STATIC='${{ secrets.SPRING_CLOUD_AWS_REGION_STATIC }}' \
            --from-literal=SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY='${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}' \
            --from-literal=SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY='${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY }}' \
            --from-literal=SPRING_AUTOCONFIGURE_EXCLUDE='${{ secrets.SPRING_AUTOCONFIGURE_EXCLUDE }}' \
            --from-literal=CLOUD_AWS_S3_BUCKET='${{ secrets.CLOUD_AWS_S3_BUCKET }}' \
            --from-literal=CLOUD_AWS_REGION_STATIC='${{ secrets.CLOUD_AWS_REGION_STATIC }}' \
            --from-literal=CLOUD_AWS_S3_ENDPOINT='${{ secrets.CLOUD_AWS_S3_ENDPOINT }}' \
            --from-literal=CLOUD_OCI_NAMESPACE='${{ secrets.CLOUD_OCI_NAMESPACE }}' \
            --from-literal=CLOUD_STORAGE_BUCKET_NAME='${{ secrets.CLOUD_STORAGE_BUCKET_NAME }}' \
            --from-literal=SERVER_PORT='8080' \
            --from-literal=SERVER_FORWARD_HEADERS_STRATEGY='${{ secrets.SERVER_FORWARD_HEADERS_STRATEGY }}' \
            --from-literal=COOLSMS_API_KEY='${{ secrets.COOLSMS_API_KEY }}' \
            --from-literal=COOLSMS_API_SECRET='${{ secrets.COOLSMS_API_SECRET }}' \
            --from-literal=COOLSMS_FROM_NUMBER='${{ secrets.COOLSMS_FROM_NUMBER }}' \
            --from-literal=GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            --from-literal=NAVER_CLIENT_SECRET='${{ secrets.NAVER_CLIENT_SECRET }}' \
            --from-literal=KEYSECRET='${{ secrets.KEYSECRET }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply k3s manifests
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: pixo-backend
            namespace: pixo
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: pixo-backend
            template:
              metadata:
                labels:
                  app: pixo-backend
              spec:
                nodeSelector:
                  workload: home
                containers:
                  - name: backend
                    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 8080
                    envFrom:
                      - secretRef:
                          name: pixo-env
                    resources:
                      requests:
                        memory: "384Mi"
                        cpu: "100m"
                      limits:
                        memory: "768Mi"
                        cpu: "1000m"
                    startupProbe:
                      tcpSocket:
                        port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      failureThreshold: 30
                    livenessProbe:
                      tcpSocket:
                        port: 8080
                      periodSeconds: 30
                      failureThreshold: 3
                    readinessProbe:
                      tcpSocket:
                        port: 8080
                      periodSeconds: 10
                      failureThreshold: 3
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: pixo-backend
            namespace: pixo
          spec:
            selector:
              app: pixo-backend
            ports:
              - port: 8080
                targetPort: 8080
            type: ClusterIP
          EOF

      - name: Rollout deployment
        run: |
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pod -n ${{ env.K8S_NAMESPACE }} -l app=pixo-backend
          echo "✅ Deployed image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.sha }}"