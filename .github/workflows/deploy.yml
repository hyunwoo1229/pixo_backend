name: CI/CD to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pixo-backend
          IMAGE_TAG: latest
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            docker network create pixo-network || true
            
            docker network connect pixo-network pixo-redis || true
            
            docker stop pixo-backend || true
            docker rm pixo-backend || true
            docker rmi ${{ steps.login-ecr.outputs.registry }}/pixo-backend:latest || true
            
            docker pull ${{ steps.login-ecr.outputs.registry }}/pixo-backend:latest
            
            docker run -d \
              --name pixo-backend \
              --network pixo-network \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="${{ secrets.SPRING_DATASOURCE_USERNAME }}" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.SPRING_DATASOURCE_PASSWORD }}" \
              - e SPRING_DATA_REDIS_HOST="${{ secrets.SPRING_DATA_REDIS_HOST }}" \
              - e SPRING_DATA_REDIS_PORT="${{ secrets.SPRING_DATA_REDIS_PORT }}" \
              -e SPRING_MAIL_HOST="${{ secrets.SPRING_MAIL_HOST }}" \
              -e SPRING_MAIL_PORT="${{ secrets.SPRING_MAIL_PORT }}" \
              -e SPRING_MAIL_USERNAME="${{ secrets.SPRING_MAIL_USERNAME }}" \
              -e SPRING_MAIL_PASSWORD="${{ secrets.SPRING_MAIL_PASSWORD }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM }}" \
              -e SPRING_JPA_HIBERNATE_DIALECT="${{ secrets.SPRING_JPA_HIBERNATE_DIALECT }}" \
              -e SPRING_CLOUD_AWS_REGION_STATIC="${{ secrets.SPRING_CLOUD_AWS_REGION_STATIC }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY="${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY="${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY }}" \
              -e SPRING_AUTOCONFIGURE_EXCLUDE="${{ secrets.SPRING_AUTOCONFIGURE_EXCLUDE }}" \
              -e CLOUD_AWS_S3_BUCKET="${{ secrets.CLOUD_AWS_S3_BUCKET }}" \
              -e CLOUD_AWS_REGION_STATIC="${{ secrets.CLOUD_AWS_REGION_STATIC }}" \
              -e CLOUD_STORAGE_BUCKET_NAME="${{ secrets.CLOUD_STORAGE_BUCKET_NAME }}" \
              -e SERVER_PORT="${{ secrets.SERVER_PORT }}" \
              -e SERVER_FORWARD_HEADERS_STRATEGY="${{ secrets.SERVER_FORWARD_HEADERS_STRATEGY }}" \
              -e COOLSMS_API_KEY="${{ secrets.COOLSMS_API_KEY }}" \
              -e COOLSMS_API_SECRET="${{ secrets.COOLSMS_API_SECRET }}" \
              -e COOLSMS_FROM_NUMBER="${{ secrets.COOLSMS_FROM_NUMBER }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e KEYSECRET="${{ secrets.KEYSECRET }}" \
              ${{ steps.login-ecr.outputs.registry }}/pixo-backend:latest
            
            sleep 5
            docker logs --tail 20 pixo-backend
            docker image prune -f