name: CI/CD to OCI Instance

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Copy JAR to OCI via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app/"
          strip_components: 2
          overwrite: true

      - name: Deploy to OCI via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eo pipefail

            cd /home/ubuntu/app

            rm -f *-plain.jar

            JAR_COUNT=$(ls -1 *.jar 2>/dev/null | wc -l)
            if [ "$JAR_COUNT" -ne 1 ]; then
              echo "::error::Expected exactly 1 JAR file, found $JAR_COUNT"
              ls -la *.jar 2>/dev/null || true
              exit 1
            fi

            printf 'FROM eclipse-temurin:17-jre-jammy\nARG JAR_FILE=*.jar\nCOPY ${JAR_FILE} app.jar\nENTRYPOINT ["java", "-jar", "/app.jar"]\n' > Dockerfile

            docker network create pixo-network 2>/dev/null || true
            docker network connect pixo-network pixo-mysql 2>/dev/null || true

            docker stop pixo-backend 2>/dev/null || true
            docker rm pixo-backend 2>/dev/null || true
            docker rmi pixo-backend:latest 2>/dev/null || true

            docker build -t pixo-backend:latest .

            docker run -d \
              --name pixo-backend \
              --network pixo-network \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL="${{ secrets.SPRING_DATASOURCE_URL }}" \
              -e SPRING_DATASOURCE_USERNAME="root" \
              -e SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e SPRING_JPA_HIBERNATE_DIALECT="${{ secrets.SPRING_JPA_HIBERNATE_DIALECT }}" \
              -e SPRING_DATA_REDIS_HOST="${{ secrets.SPRING_DATA_REDIS_HOST }}" \
              -e SPRING_DATA_REDIS_PORT="${{ secrets.SPRING_DATA_REDIS_PORT }}" \
              -e SPRING_MAIL_HOST="${{ secrets.SPRING_MAIL_HOST }}" \
              -e SPRING_MAIL_PORT="${{ secrets.SPRING_MAIL_PORT }}" \
              -e SPRING_MAIL_USERNAME="${{ secrets.SPRING_MAIL_USERNAME }}" \
              -e SPRING_MAIL_PASSWORD="${{ secrets.SPRING_MAIL_PASSWORD }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE }}" \
              -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM="${{ secrets.SPRING_MAIL_PROPERTIES_MAIL_SMTP_FROM }}" \
              -e SPRING_CLOUD_AWS_REGION_STATIC="${{ secrets.SPRING_CLOUD_AWS_REGION_STATIC }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY="${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY }}" \
              -e SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY="${{ secrets.SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY }}" \
              -e SPRING_AUTOCONFIGURE_EXCLUDE="${{ secrets.SPRING_AUTOCONFIGURE_EXCLUDE }}" \
              -e CLOUD_AWS_S3_BUCKET="${{ secrets.CLOUD_AWS_S3_BUCKET }}" \
              -e CLOUD_AWS_REGION_STATIC="${{ secrets.CLOUD_AWS_REGION_STATIC }}" \
              -e CLOUD_STORAGE_BUCKET_NAME="${{ secrets.CLOUD_STORAGE_BUCKET_NAME }}" \
              -e SERVER_PORT="${{ secrets.SERVER_PORT }}" \
              -e SERVER_FORWARD_HEADERS_STRATEGY="${{ secrets.SERVER_FORWARD_HEADERS_STRATEGY }}" \
              -e COOLSMS_API_KEY="${{ secrets.COOLSMS_API_KEY }}" \
              -e COOLSMS_API_SECRET="${{ secrets.COOLSMS_API_SECRET }}" \
              -e COOLSMS_FROM_NUMBER="${{ secrets.COOLSMS_FROM_NUMBER }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
              -e KEYSECRET="${{ secrets.KEYSECRET }}" \
              pixo-backend:latest

            sleep 10
            if ! docker ps --filter "name=pixo-backend" --filter "status=running" | grep -q pixo-backend; then
              echo "::error::pixo-backend container failed to start"
              docker logs --tail 50 pixo-backend 2>/dev/null || true
              exit 1
            fi

            echo "pixo-backend is running"
            docker logs --tail 20 pixo-backend
            docker image prune -f

            rm -f *.jar Dockerfile